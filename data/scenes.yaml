# ============================================================
#  场景状态表 —— Act 1 厨房 (夜)  ↔  Act 2 Boston 旅馆 (崩塌)
# ============================================================
#  任务书硬要求：两个形成对比的场景。
#  这里定义每个场景下每台灯的**强度百分比**与**色片覆盖**，
#  渲染器据此生成「分场景平面图」和色片用量统计。
#
#  对比逻辑（设计概念，不是技术说明）：
#    · 厨房 = 现实。冷、薄、来自头顶的日光灯 + 窗外一点街灯的蓝。
#      光要有"被生活用旧了"的质感：照度够看清单据，不够温暖。
#    · Boston = 回忆/崩塌。暖得过分，然后被剥掉。
#      Willy 在旅馆里谈论成功的那一刻，光是最暖的；
#      儿子揭穿他的那一刻，暖光逐层抽走，只剩一束侧光把人钉在床上。
#  这两个状态共用同一套灯 —— 靠色片与强度切换实现，不另起灯位。
#  这是任务书里"两场对比"的正确做法：对比来自**光的组织方式**，
#  不是来自灯具数量。
# ============================================================

scenes:

  kitchen:
    id: ACT 1
    name: KITCHEN / NIGHT
    cn: 厨房 · 夜
    concept: >
      现实。冷白日光灯管压顶，窗外一点街灯的钠黄透进来。
      照度刚好够看清账单，不够温暖。所有暖色都被生活用旧了。
    # 色片覆盖：哪些灯位换什么色片（覆盖 rig.yaml 的 gel）
    gel_override:
      L201: "L201"          # 面光保持冷白
      L132: "L202"          # 厨房的"暖"其实是脏黄，用 L202 代替 L132
      L711: "L200"          # 后墙从冷蓝改成都市的灰蓝
    # 强度（0-100）。未列出的用 default_level
    default_level: 0
    levels:
      FOH: 45               # 面光压到 45，人物只有半张脸是清楚的
      LX1: 30               # 顶光很弱，制造眼窝阴影
      LX2: 0                # 中区关掉
      LX3: 15               # 后墙只留一点
      BOOM SL: 60           # 侧光切出窗框的影子
      BOOM SR: 0
      SET: 70               # 冰箱、台灯是唯一真正的光源感

  boston:
    id: ACT 2
    name: BOSTON HOTEL ROOM
    cn: Boston 旅馆房间
    concept: >
      回忆。暖得过分 —— 那是 Willy 记住的版本，不是发生过的版本。
      然后暖光被一层层抽走，最后只剩一束侧光把父子钉在床上。
      光的崩塌就是戏的崩塌。
    gel_override:
      L201: "L132"          # 面光转暖
      L132: "L103"          # 顶光转更暖的稻草色
      L711: "L119"          # 后墙转深蓝（窗外的夜）
    default_level: 0
    levels:
      FOH: 70
      LX1: 55
      LX2: 40
      LX3: 25
      BOOM SL: 35
      BOOM SR: 45
      SET: 20

# 场景切换时"光如何变化"的说明，进 Cue Sheet 时用
transitions:
  - from: kitchen
    to: boston
    note: >
      Willy 说 "The woods are burning" 之后，厨房光在 8 秒内
      被 Boston 的暖光替换 —— 两个状态重叠 3 秒，让观众看见
      "现实被回忆覆盖"这件事发生，而不是硬切。
