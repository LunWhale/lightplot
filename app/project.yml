name: LightPlot
options:
  bundleIdPrefix: studio.lightplot
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "2600"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.001"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  LightPlotCore:
    path: .

targets:
  # ------------------------------------------------------------------ macOS
  LightPlot-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/LightPlotApp
      - path: Config/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: LightPlotCore
        product: LightPlotUI
      - package: LightPlotCore
        product: LightPlotCore
    settings:
      base:
        PRODUCT_NAME: LightPlot
        PRODUCT_BUNDLE_IDENTIFIER: studio.lightplot.app
        INFOPLIST_KEY_CFBundleDisplayName: LightPlot
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        GENERATE_INFOPLIST_FILE: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Config/LightPlot-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Config/Info-macOS.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Lighting Plan
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.yaml
              - public.json
              - studio.lightplot.plan
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: studio.lightplot.plan
            UTTypeDescription: LightPlot Plan
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - lpx
        NSHumanReadableCopyright: ""

  # ------------------------------------------------------------------- iPad
  LightPlot-iPadOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/LightPlotApp
    dependencies:
      - package: LightPlotCore
        product: LightPlotUI
      - package: LightPlotCore
        product: LightPlotCore
    settings:
      base:
        PRODUCT_NAME: LightPlot
        PRODUCT_BUNDLE_IDENTIFIER: studio.lightplot.app
        TARGETED_DEVICE_FAMILY: "2"        # iPad only
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/LightPlot-iOS.entitlements
    info:
      path: Config/Info-iOS.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Lighting Plan
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.yaml
              - public.json
              - studio.lightplot.plan
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: studio.lightplot.plan
            UTTypeDescription: LightPlot Plan
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - lpx

schemes:
  LightPlot-macOS:
    build:
      targets:
        LightPlot-macOS: all
    run:
      config: Debug
    archive:
      config: Release

  LightPlot-iPadOS:
    build:
      targets:
        LightPlot-iPadOS: all
    run:
      config: Debug
    archive:
      config: Release
